packages:
  - 'packages/*'
  # The examples are workspace members so CI builds, type-checks and tests them against the code in this
  # commit (spec 0.2.0 §7). Each is `private`, so publishing skips it; an adopter who copies one out
  # replaces its `workspace:*` ranges with the published version.
  - 'examples/*'
# pnpm 11 requires an explicit decision on every dependency postinstall script. esbuild's is how it
# places its own platform binary; vite (vitest) and tsup both need it, so the toolchain cannot run
# without it. Nothing else in the workspace is allowed to run a build script.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - zod@4.6.3
