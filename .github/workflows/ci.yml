name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          # Required since 0.2.0: Windows passes the whole suite (spec 0.2.0 §9.1, §12.1).
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      # No model credential and no GitHub token are in scope: the unit tests run a fake Claude Code
      # and never spend money. The paid end-to-end tests are a separate config and never run here.
      - run: pnpm test

  alpine:
    # musl Linux is "best effort" (spec 0.2.0 §9.1): the suite must still pass on it.
    name: test (node:22-alpine)
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - run: apk add --no-cache git tar
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test

  claude-smoke:
    # The real Claude Code, at $0 (spec 0.2.0 §12.1): installed at the version the App runner pins, run
    # by the engine with NO credential — it answers "Not logged in" without reaching a model. Proves the
    # binary is found (npm's Windows layout included) and started with the reviewer's real flags.
    name: claude smoke, $0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The version packages/app/trigger.config.ts pins (CLAUDE_CODE_VERSION).
      # --allow-scripts: npm 12 skips a dependency's install script otherwise, leaving a placeholder (spike S2).
      - run: npm install --global --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.258
      - run: node scripts/claude-smoke.mjs
